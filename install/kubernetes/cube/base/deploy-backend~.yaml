# encoding: utf-8
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeflow-dashboard
  labels:
    app: kubeflow-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubeflow-dashboard
  template:
    metadata:
      name: kubeflow-dashboard
      labels:
        app: kubeflow-dashboard
    spec:
      initContainers:
      - name: set-permissions
        image: busybox:1.36
        command: ['sh', '-c']
        args:
        - |
          echo "Setting permissions for /home/myapp/myapp directory..."
          chmod -R 755 /home/myapp/myapp
          chown -R 0:0 /home/myapp/myapp
          echo "Permissions set successfully."
        volumeMounts:
        - name: myapp-local
          mountPath: /home/myapp/myapp
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          privileged: true  
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubeflow-dashboard
                operator: In
                values:
                - "true"
      volumes:
        - name: tz-config
          hostPath:
            path: /usr/share/zoneinfo/Asia/Shanghai
        - name: kubeflow-dashboard-config
          configMap:
            name: kubeflow-dashboard-config-cc2kbh2dkm
            items:
              - key: entrypoint.sh
                path: entrypoint.sh
              - key: config.py
                path: config.py
              - key: project.py
                path: project.py
        - name: kubernetes-config
          configMap:
            name: kubernetes-config
        - name: infra-kubeflow
          persistentVolumeClaim:
            claimName: infra-kubeflow
        - name: myapp-local
          hostPath:
            path: /root/cube/cube-studio/myapp
            type: Directory

      serviceAccountName: kubeflow-dashboard

      imagePullSecrets:
        - name: hubsecret
      containers:
        - name: kubeflow-dashboard
          image: ccr.ccs.tencentyun.com/cube-studio/kubeflow-dashboard:2026.01.01
          imagePullPolicy: IfNotPresent  # IfNotPresent   Always
          command: ["bash","/entrypoint.sh"]
          securityContext:
            runAsUser: 0  # 以 root 用户运行
            runAsGroup: 0
            allowPrivilegeEscalation: true
          env:
          - name: STAGE
            value: $(STAGE)

          - name: REDIS_HOST
            valueFrom:
              configMapKeyRef:
                name: deploy-config-b6hmt7m758
                key: REDIS_HOST
          - name: REDIS_PORT
            valueFrom:
              configMapKeyRef:
                name: deploy-config-b6hmt7m758
                key: REDIS_PORT
          - name: REDIS_PASSWORD
            valueFrom:
              configMapKeyRef:
                name: deploy-config-b6hmt7m758
                key: REDIS_PASSWORD
          - name: MYSQL_SERVICE
            valueFrom:
              configMapKeyRef:
                name: deploy-config-b6hmt7m758
                key: MYSQL_SERVICE
          - name: ENVIRONMENT
            valueFrom:
              configMapKeyRef:
                name: deploy-config-b6hmt7m758
                key: ENVIRONMENT

          volumeMounts:
            - name: kubeflow-dashboard-config
              mountPath: /entrypoint.sh
              subPath: entrypoint.sh
            - name: kubeflow-dashboard-config
              mountPath: /home/myapp/myapp/config.py
              subPath: config.py
            - name: kubeflow-dashboard-config
              mountPath: /home/myapp/myapp/project.py
              subPath: project.py
            - name: tz-config
              mountPath: /etc/localtime
            - name: infra-kubeflow
              mountPath: /data/k8s/kubeflow/
            - name: kubernetes-config
              mountPath: /home/myapp/kubeconfig
            - name: myapp-local
              mountPath: /home/myapp/myapp
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            limits:
              cpu: 10
              memory: 10Gi
            requests:
              cpu: 10m
              memory: 100Mi
          readinessProbe:
            failureThreshold: 2
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 60
            timeoutSeconds: 10
          livenessProbe:
            failureThreshold: 2
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 500
            periodSeconds: 60
            timeoutSeconds: 10


---
# encoding: utf-8
apiVersion: v1
kind: Service
metadata:
  name: kubeflow-dashboard
  namespace: infra
  labels:
    app: kubeflow-dashboard
spec:
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
  selector:
    app: kubeflow-dashboard
    